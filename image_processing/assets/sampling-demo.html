<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sampling vs Quantization</title>
<style>
body{font-family:sans-serif;margin:20px;color:#222}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
canvas{border:1px solid #ccc} label{display:block;margin:8px 0} input{width:300px}
</style></head><body>
<h2>Sampling vs quantization</h2>
<label>Samples per side N (sampling): <b id="nv"></b><br><input id="n" type="range" min="0" max="5" value="0"></label>
<label>Bits per pixel k (quantization): <b id="kv"></b><br><input id="k" type="range" min="1" max="8" value="8"></label>
<button id="reset">Reset</button>
<p id="info"></p>
<div class="row">
  <canvas id="img" width="512" height="512"></canvas>
  <div><canvas id="plot" width="420" height="260"></canvas>
  <p style="max-width:420px;font-size:14px">Row 256 (through the middle). Gray = original, blue = processed.
  Fewer samples = wider steps sideways. Fewer bits = fewer allowed heights (faint lines).</p>
  <p id="cap" style="max-width:420px"></p></div>
</div>
<script>
const S=512, sizes=[512,256,128,64,32,16];
const src=new Float32Array(S*S);
for(let x=0;x<S;x++)for(let y=0;y<S;y++){          // x = row, y = column (book convention)
  let v=(x+y)/(2*S)*255;                            // smooth gradient
  const dx=x-256, dy=y-256, nx=dx/130, ny=dy/130, r2=nx*nx+ny*ny;
  if(r2<1){ const nz=Math.sqrt(1-r2);               // shaded sphere
    v=40+215*Math.max(0,-0.5*nx-0.5*ny+0.707*nz); }
  if(x>=20&&x<110&&y>=320&&y<500){                  // stripes, getting thinner
    const c=y-320, w=[8,6,4,2,1][Math.floor(c/36)];
    v=(Math.floor(c/w)%2)?255:0; }
  src[x*S+y]=Math.min(255,Math.max(0,v));
}
const nEl=document.getElementById('n'), kEl=document.getElementById('k');
const img=document.getElementById('img').getContext('2d');
const pl=document.getElementById('plot').getContext('2d');
function render(){
  const N=sizes[+nEl.value], k=+kEl.value, L=2**k, b=S/N;
  const out=new Float32Array(S*S);
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    let s=0;                                         // sampling: one value per block
    for(let x=i*b;x<(i+1)*b;x++)for(let y=j*b;y<(j+1)*b;y++)s+=src[x*S+y];
    let v=s/(b*b);
    v=Math.round(v/255*(L-1))*255/(L-1);             // quantization: nearest of L levels
    for(let x=i*b;x<(i+1)*b;x++)for(let y=j*b;y<(j+1)*b;y++)out[x*S+y]=v;
  }
  const id=img.createImageData(S,S);
  for(let p=0;p<S*S;p++){id.data[4*p]=id.data[4*p+1]=id.data[4*p+2]=out[p];id.data[4*p+3]=255;}
  img.putImageData(id,0,0);
  const W=420,H=260,P=20,X=y=>P+y/(S-1)*(W-2*P),Y=v=>H-P-v/255*(H-2*P);
  pl.clearRect(0,0,W,H);
  if(L<=32){pl.strokeStyle='#e4e4e4';pl.lineWidth=1;
    for(let q=0;q<L;q++){const yy=Y(q*255/(L-1));pl.beginPath();pl.moveTo(P,yy);pl.lineTo(W-P,yy);pl.stroke();}}
  const line=(a,c,w)=>{pl.strokeStyle=c;pl.lineWidth=w;pl.beginPath();
    for(let y=0;y<S;y++){const px=X(y),py=Y(a[256*S+y]);y?pl.lineTo(px,py):pl.moveTo(px,py);}pl.stroke();};
  line(src,'#aaa',1); line(out,'#1565c0',2);
  document.getElementById('nv').textContent=N+' x '+N;
  document.getElementById('kv').textContent=k+'  (L = '+L+' levels)';
  document.getElementById('info').textContent='Image: '+N+' x '+N+' pixels, k = '+k+' bits, L = '+L+
    ' levels. Storage = '+N+'·'+N+'·'+k+' bits = '+(N*N*k/8).toLocaleString()+' bytes.';
  let cap='';
  if(N<512)cap+='Fewer samples: each pixel covers a bigger area of the scene, so you get blocks (checkerboard effect) and the fine stripes disappear. ';
  if(k<=4)cap+='Fewer gray levels: smooth regions break into bands (false contouring). Edges are NOT blurred.';
  document.getElementById('cap').textContent=cap;
}
nEl.oninput=kEl.oninput=render;
document.getElementById('reset').onclick=()=>{nEl.value=0;kEl.value=8;render();};
render();
</script></body></html>
